version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nihplod-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nihplod
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nihplod_bavp
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
